/* ---------- mapa esquemático ---------- */
function mapSVG(locIds, routes, opts = {}) {
  const ids = [...new Set(locIds.filter(Boolean))]; const pts = ids.map(T.loc).filter(Boolean);
  if (!pts.length) return '<div class="empty">Sem locais para exibir.</div>';
  const W = 640, H = opts.h || 340, pad = 40;
  let minLat = Math.min(...pts.map(p => p.lat)), maxLat = Math.max(...pts.map(p => p.lat)), minLon = Math.min(...pts.map(p => p.lon)), maxLon = Math.max(...pts.map(p => p.lon));
  if (maxLat - minLat < 2) { minLat -= 1; maxLat += 1; } if (maxLon - minLon < 2) { minLon -= 1; maxLon += 1; }
  const k = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
  const sx = (W - 2 * pad) / ((maxLon - minLon) * k), sy = (H - 2 * pad) / (maxLat - minLat); const s = Math.min(sx, sy);
  const ox = (W - (maxLon - minLon) * k * s) / 2, oy = (H - (maxLat - minLat) * s) / 2;
  const P = id => { const l = T.loc(id); return [ox + (l.lon - minLon) * k * s, oy + (maxLat - l.lat) * s]; };
  let g = '';
  const step = Math.max(1, Math.round((maxLon - minLon) / 8));
  for (let lo = Math.ceil(minLon); lo <= maxLon; lo += step) { const x = ox + (lo - minLon) * k * s; g += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--map-grid)"/>`; }
  for (let la = Math.ceil(minLat); la <= maxLat; la += step) { const y = oy + (maxLat - la) * s; g += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--map-grid)"/>`; }
  const rt = (routes || []).map(r => { const pts2 = r.path.map(P); const color = r.color || 'var(--accent)'; return `<polyline points="${pts2.map(p => p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="${r.w || 2.5}" ${r.dash ? 'stroke-dasharray="6 5"' : ''} stroke-linejoin="round" marker-end="url(#ah)"/>`; }).join('');
  const dots = ids.map(id => { const [x, y] = P(id); const l = T.loc(id); const t = /Porto|Aeroporto/.test(l.type) ? 'rect' : 'circle'; return `<g>${t === 'rect' ? `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" fill="var(--surface)" stroke="var(--fg)" stroke-width="1.5"/>` : `<circle cx="${x}" cy="${y}" r="5" fill="var(--surface)" stroke="var(--fg)" stroke-width="1.5"/>`}<text x="${x + 8}" y="${y - 7}" font-size="11">${esc(l.city)}</text></g>`; }).join('');
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa esquemático da rota"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg-2)"/></marker></defs>${g}${rt}${dots}</svg>`;
}

/* ---------- Gantt ---------- */
function ganttSVG(docs) {
  if (!docs.length) return '<div class="empty">Nenhum documento no horizonte.</div>';
  const t0 = new Date(S.clock.slice(0, 10) + 'T00:00').getTime() - 86400000; const days = 7; const t1 = t0 + days * 86400000;
  const W = 900, lw = 230, rowH = 30, H = 30 + docs.length * rowH;
  const X = iso => lw + Math.max(0, Math.min(1, (new Date(iso).getTime() - t0) / (t1 - t0))) * (W - lw - 10);
  let g = '';
  for (let d = 0; d <= days; d++) { const x = lw + d / days * (W - lw - 10); const day = new Date(t0 + d * 86400000); g += `<line x1="${x}" y1="18" x2="${x}" y2="${H}" stroke="var(--line)"/>` + (d < days ? `<text x="${x + 4}" y="13" font-size="13" fill="var(--fg-2)">${String(day.getDate()).padStart(2, '0')}/${String(day.getMonth() + 1).padStart(2, '0')}</text>` : ''); }
  const nx = X(S.clock); g += `<line x1="${nx}" y1="18" x2="${nx}" y2="${H}" stroke="var(--neg)" stroke-width="1.5"/>`;
  docs.forEach((f, i) => {
    const y = 24 + i * rowH; const a = f.stops[0].planArr, b = f.stops[f.stops.length - 1].planDep;
    const x1 = X(a), x2 = Math.max(X(b), x1 + 3);
    const color = f.exec === 'Executado' ? 'var(--pos)' : f.exec === 'Em execução' ? 'var(--crit)' : 'var(--accent)';
    g += `<text x="4" y="${y + 13}" font-size="14">${esc(f.id)} · ${esc(f.resource || f.voyage || f.mtr)}</text><rect x="${x1}" y="${y + 3}" width="${x2 - x1}" height="18" rx="3" fill="${color}" opacity=".85" data-a="open" data-id="${f.id}" style="cursor:pointer"/>`;
  });
  return `<div class="tw" style="border:0"><svg class="gantt" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de Gantt">${g}</svg></div>`;
}

  const resList = S.md.resources.filter(r => !C.zone || T.inArea(r.home, C.zone) || true);
  const left = `<div class="sec"><h3>Etapas de unidades de frete <span class="muted small">${selected.length} selecionada(s) · ${kg(load.kg)} · ${nf(load.pal, 1)} pal · ${nf(load.m3, 1)} m³</span></h3>

  </div>`;
  const resTab = `${table([{ l: '', f: r => `<input type="radio" name="ckres" data-a="ckres" data-id="${r.id}" ${C.res === r.id ? 'checked' : ''} aria-label="Selecionar recurso">` }, { l: 'Recurso', f: r => `<span class="mono">${r.id}</span>` }, { l: 'Meio de transporte', f: r => esc(T.mtr(r.mtr).desc) }, { l: 'Base', f: r => esc(T.loc(r.home).city) }, { l: 'Capacidade', f: r => { const m = T.mtr(r.mtr); return `${nf(m.capKg / 1000)} t · ${m.capPal} pal`; } }, { l: 'Uso (sel.)', f: r => selected.length ? capBar(load.kg, T.mtr(r.mtr).capKg) : '—' }, { l: 'Qtd.', num: 1, f: r => r.qty }], resList)}`;
  const docTab = table([{ l: '', f: r => `<input type="radio" name="ckdoc" data-a="ckdoc" data-id="${r.id}" ${C.doc === r.id ? 'checked' : ''} aria-label="Selecionar documento">` }, { l: 'Documento', f: r => L(r.id) }, { l: 'Rota', f: r => esc(r.stops.map(s => T.loc(s.loc).city).join(' → ')) }, { l: 'Partida / veículo', f: r => r.cat === 'FB' ? 'Partida ' + dt(r.stops[0].planDep) : esc(r.mtr) }, { l: 'Ocupação', f: r => capBar(r.kg, r.cat === 'FB' ? r.capKg : T.mtr(r.mtr).capKg) }, { l: 'Status', f: r => r.fixed ? st('Fixado') : st(r.sub.status) }], docs.filter(d => d.cat === 'FO' ? C.mode === 'RD' || !C.mode : true), { empty: 'Nenhum documento aberto para este modal.' });
  const right = `<div class="sec"><h3>${C.mode === 'RD' ? 'Recursos de veículo e ordens de frete' : 'Bookings de frete'}</h3>
    <div class="toolbar" style="margin-bottom:10px">
      ${C.mode === 'RD' ? btn('Criar OF com recurso', 'ckCreate', {}, 'pri', !selected.length || !C.res) : ''}
      ${btn('Atribuir ao documento', 'ckAssign', {}, C.mode !== 'RD' ? 'pri' : '', !selected.length || !C.doc)}
      ${C.mode === 'RD' ? btn('Otimizar (VSR)', 'ckOpt', {}, '') : btn('Gestão de capacidade', 'go', { app: 'cap' })}
      ${btn('Proposta de transporte', 'ckTP', {}, '', selected.length !== 1)}
      ${btn('Desatribuir', 'ckUnassign', {}, 'neg', !C.doc)}
    </div>
    ${C.mode === 'RD' ? `<h4>Recursos de veículo</h4>${resTab}<h4>Ordens de frete abertas</h4>` : ''}${docTab}</div>`;
  // mapa: seleção (tracejado) + documento selecionado (sólido)
  const mlocs = [...selected.flatMap(e => [e.st.from, e.st.to]), ...(doc ? doc.stops.map(s => s.loc) : [])];
  const routes = [...selected.map(e => ({ path: [e.st.from, e.st.to], dash: true, color: 'var(--crit)', w: 2 })), ...(doc ? [{ path: doc.stops.map(s => s.loc), color: 'var(--accent)', w: 3 }] : [])];
  const bottom = `<div class="grid2" style="margin-top:14px"><div class="sec"><h3>Mapa <span class="legend"><span><i class="d"></i>Etapas selecionadas</span><span><i></i>Documento selecionado</span></span></h3>${mlocs.length ? mapSVG(mlocs, routes) : '<div class="empty">Selecione etapas ou um documento para ver no mapa.</div>'}
    ${doc ? `<h4>Paradas de ${doc.id}</h4>${table([{ l: '#', f: r => doc.stops.indexOf(r) + 1 }, { l: 'Local', f: r => esc(T.locName(r.loc)) }, { l: 'Chegada', f: r => dt(r.planArr) }, { l: 'Partida', f: r => dt(r.planDep) }, { l: 'Carrega', f: r => r.load.length }, { l: 'Descarrega', f: r => r.unload.length }], doc.stops)}` : ''}</div>
    <div class="sec"><h3>Gráfico de Gantt <span class="muted small">documentos do dia ${d10(T.addH(S.clock, -24))} em diante · linha vermelha = agora</span></h3>${ganttSVG(S.fo.filter(f => f.life !== 'Cancelado' && f.stages.length && f.stops[f.stops.length - 1].planDep >= T.addH(S.clock, -24)).sort((a, b) => a.stops[0].planArr < b.stops[0].planArr ? -1 : 1).slice(0, 14))}</div></div>`;
  return header({ title: 'Cockpit de transporte', sub: 'Perfil de seleção, perfil de planejamento ' + S.md.settings.planning.id + ' · cap. 5.7' }) +
    `<div class="sec"><div class="fbar" style="margin:0">${fld('Modal', sel('ck_mode', [['RD', 'Rodoviário'], ['SEA', 'Marítimo'], ['AIR', 'Aéreo']], C.mode, 'data-c="ck"'))}${fld('Zona de origem', sel('ck_zone', [['', 'Todas'], ...zoneOpts], C.zone, 'data-c="ck"'))}${fld('Exibir', sel('ck_planned', [['0', 'Somente não planejadas'], ['1', 'Incluir planejadas']], C.showPlanned ? '1' : '0', 'data-c="ck"'))}
    <div class="muted small" style="max-width:520px">Selecione etapas à esquerda e um recurso ou documento à direita. Etapas marítimas e aéreas são atribuídas a bookings; rodoviárias viram ordens de frete. Incompatibilidades e capacidade são verificadas a cada atribuição.</div></div></div>
    <div class="ck-grid">${left}${right}</div>${bottom}`;
}

/* ==========================================================================
   Apps: ordens de frete, bookings, tendering, portal, eventos, liquidação

function foCols() {
  return [{ l: 'Documento', f: r => `<span class="mono">${r.id}</span>` }, { l: 'Tipo', k: 'type' }, { l: 'Rota', f: r => esc(r.stops.map(s => T.loc(s.loc).city).join(' → ')) }, { l: 'Início', f: r => dt(r.stops[0] && r.stops[0].planArr) },
  { l: 'Transportadora', f: r => esc(r.carrier ? T.bpName(r.carrier) : r.subcontract ? '—' : 'Frota própria') }, { l: 'Peso', num: 1, f: r => kg(r.kg) }, { l: 'Subcontratação', f: r => st(r.sub.status) }, { l: 'Execução', f: r => st(r.exec) }, { l: 'Liquidação', f: r => st(r.inv) }];
}
function vFOList(cat) {
  const rows = S.fo.filter(f => f.cat === cat);
  return listReport({ title: cat === 'FO' ? 'Ordens de frete' : 'Bookings de frete', sub: cat === 'FO' ? 'Freight orders · cap. 6.1' : 'Freight bookings · cap. 6.2', rows, open: 'fo', rowId: r => r.id,
    filters: [{ k: 'q', l: 'Pesquisa', test: (r, v) => txt(r, v, 'id', 'voyage', r => T.bpName(r.carrier), r => r.stops.map(s => T.loc(s.loc).city).join(' ')) }, { k: 'sub', l: 'Subcontratação', opts: [...new Set(rows.map(r => r.sub.status))], test: (r, v) => r.sub.status === v }, { k: 'ex', l: 'Execução', opts: [...new Set(rows.map(r => r.exec))], test: (r, v) => r.exec === v }, ...(cat === 'FB' ? [{ k: 'load', l: 'Carga', opts: [['1', 'Com UFs'], ['0', 'Vazios']], test: (r, v) => (r.stages.length > 0) === (v === '1') }] : [])],
    actions: cat === 'FO' ? btn('Cockpit de transporte', 'go', { app: 'cockpit' }, 'pri') : btn('Gestão de capacidade', 'go', { app: 'cap' }, 'pri'),
    cols: cat === 'FB' ? [{ l: 'Booking', f: r => `<span class="mono">${r.id}</span>` }, { l: 'Viagem/voo', f: r => esc(r.voyage) }, { l: 'Transportadora', f: r => esc(T.bpName(r.carrier)) }, { l: 'Rota', f: r => esc(T.loc(r.stops[0].loc).city + ' → ' + T.loc(r.stops[1].loc).city) }, { l: 'Cut-off', f: r => dt(r.cutoff) }, { l: 'Partida', f: r => dt(r.stops[0].planDep) }, { l: 'Ocupação', f: r => capBar(r.kg, r.capKg) }, { l: 'Booking', f: r => st(r.sub.status) }, { l: 'Execução', f: r => st(r.life === 'Cancelado' ? 'Cancelado' : r.exec) }] : foCols() });
}

function vFO(id) {
  const f = T.fo(id); if (!f) return '<div class="empty">Documento não encontrado.</div>';
  const tab = U.tab || 'gen'; const FB = f.cat === 'FB';
  const ents = f.stages.map(T.stageOf).filter(Boolean);
  const cap = FB ? { kg: f.capKg, m3: f.capM3 } : { kg: T.mtr(f.mtr).capKg, m3: T.mtr(f.mtr).capM3, pal: T.mtr(f.mtr).capPal };
  const tn = f.sub.tender;
  const subActs = FB ? [['Solicitar booking à transportadora', 'fbReq', { id }]] :
    [['Seleção de transportadora (automática)', 'csRun', { id }], ['Atribuir transportadora manualmente…', 'csManual', { id }], ['Iniciar tendering', 'tdStart', { id }], ['Enviar ordem à transportadora', 'foSend', { id }], [f.subcontract ? 'Mudar para frota própria (sem subcontratação)' : 'Tornar relevante para subcontratação', 'foSubToggle', { id }]];
  const actions = menu('fo-sub', 'Subcontratação', subActs) + btn('Calcular encargos', 'calcFO', { id }) +
    menu('fo-ex', 'Execução', [['Verificar › Pronto para execução', 'foReady', { id }], ['Simular rastreamento (próximo evento)', 'foTrack', { id }], ['Reportar atraso…', 'foDelay', { id }], ['Reportar discrepância…', 'foDisc', { id }]]) +
    menu('fo-more', 'Mais', [[f.fixed ? 'Desfixar plano' : 'Fixar plano', 'foFix', { id }], ['Criar doc. de liquidação de frete', 'fsdCreate', { id }], ['Desatribuir todas as UFs', 'foUnassignAll', { id }], ['Cancelar documento', 'foCancel', { id }]]);
  const tabs = [{ id: 'gen', l: 'Geral' }, { id: 'stops', l: 'Paradas', c: f.stops.length }, { id: 'items', l: 'Itens / UFs', c: ents.length }, { id: 'ch', l: 'Encargos' }, { id: 'sub', l: 'Subcontratação' }, { id: 'exec', l: 'Execução', c: f.events.length }, { id: 'flow', l: 'Fluxo de documentos' }];
  let body = '';
  if (tab === 'gen') body = `<div class="grid2"><div class="sec"><h3>Dados de organização</h3>${kvs([['Categoria', FB ? 'Booking de frete (' + T.modeName(f.mode) + ')' : 'Ordem de frete rodoviária'], ['Tipo de documento', f.type], ['Org. de compras', f.purchOrg], ['Transportadora', f.carrier ? esc(f.carrier + ' ' + T.bpName(f.carrier)) : f.subcontract ? '—' : 'Frota própria'], ['Relevante p/ subcontratação', f.subcontract ? 'Sim' : 'Não'], ['Origem do plano', esc(f.origin || '—')], ['Fixado', f.fixed ? 'Sim' : 'Não'], ...(FB ? [['Programação', esc(f.schedule)], ['Viagem / voo', esc(f.voyage)], [f.mode === 'SEA' ? 'Master B/L' : 'MAWB', f.mbl || '—'], ['Cut-off de carga', dt(f.cutoff)]] : [])])}</div>
    <div class="sec"><h3>Capacidade e custos de planejamento</h3>${kvs([['Meio de transporte', esc(f.mtr + ' – ' + T.mtr(f.mtr).desc)], ['Recurso de veículo', esc(f.resource || '—')], ['Distância', nf(f.km) + ' km'], ['Peso', capBar(f.kg, cap.kg) + `<span class="small muted">${kg(f.kg)} de ${kg(cap.kg)}</span>`], ['Volume', capBar(f.m3, cap.m3) + `<span class="small muted">${nf(f.m3, 1)} de ${nf(cap.m3)} m³</span>`], ...(cap.pal ? [['Paletes', capBar(f.pal, cap.pal)]] : []), ...(!FB ? [['Custo de planejamento', money(f.planCost)], ['Atraso previsto', f.lateH ? nf(f.lateH, 1) + ' h' : 'Nenhum']] : [])])}</div></div>`;
  if (tab === 'stops') body = `<div class="sec">${table([{ l: '#', f: r => f.stops.indexOf(r) + 1 }, { l: 'Local', f: r => esc(T.locName(r.loc)) }, { l: 'Chegada plan.', f: r => dt(r.planArr) }, { l: 'Partida plan.', f: r => dt(r.planDep) }, { l: 'Chegada real', f: r => dt(r.actArr) }, { l: 'Partida real', f: r => dt(r.actDep) }, { l: 'Carregar', f: r => r.load.map(k => L(k.split('#')[0])).join(' ') || '—' }, { l: 'Descarregar', f: r => r.unload.map(k => L(k.split('#')[0])).join(' ') || '—' }], f.stops)}
    <div style="margin-top:12px">${mapSVG(f.stops.map(s => s.loc), [{ path: f.stops.map(s => s.loc), color: FB ? 'var(--crit)' : 'var(--accent)', w: 3, dash: FB }])}</div></div>`;
  if (tab === 'items') body = `<div class="sec">${table([{ l: 'UF', f: r => L(r.fu.id) }, { l: 'Etapa', f: r => r.st.n + ' ' + esc(r.st.type) }, { l: 'Requisito', f: r => r.fu.reqs.map(x => L(x.id)).join(' ') }, { l: 'De → para', f: r => esc(T.loc(r.st.from).city + ' → ' + T.loc(r.st.to).city) }, { l: 'Peso', num: 1, f: r => kg(r.fu.kg) }, { l: 'Pal.', num: 1, f: r => nf(r.fu.pal, 1) }, { l: '', f: r => dgChips(r.fu.traits) }, { l: 'Status de manuseio', f: r => st(r.st.handling) }, { l: '', f: r => `<button class="btn ghost" data-a="foUnassign" data-id="${f.id}" data-key="${r.key}">Desatribuir</button>` }], ents, { empty: 'Nenhuma UF atribuída.' })}</div>`;
  if (tab === 'ch') body = (f.tenderPrice ? `<div class="note" style="margin-bottom:12px">Preço definido no tendering: ${money(f.tenderPrice)}.</div>` : '') + chargesView(f.charges, 'custo');
  if (tab === 'sub') body = subView(f);
  if (tab === 'exec') body = execView(f);
  if (tab === 'flow') {
    const reqs = [...new Map(ents.flatMap(e => e.fu.reqs).map(r => [r.id, r])).values()];
    body = `<div class="sec"><h3>Fluxo de documentos</h3><div class="flow" style="align-items:flex-start"><div style="display:flex;flex-direction:column;gap:8px"><div class="small muted">Requisitos</div>${reqs.map(r => { const d = T.req(r); return flowNode(r.type, r.id, d && d.life); }).join('')}</div><span class="arrow">→</span><div style="display:flex;flex-direction:column;gap:8px"><div class="small muted">Unidades de frete</div>${ents.map(e => flowNode('UF', e.fu.id, e.st.handling)).join('')}</div><span class="arrow">→</span>${flowNode(FB ? 'Booking' : 'Ordem de frete', f.id, f.exec)}<span class="arrow">→</span>${f.fsd ? flowNode('DLF', f.fsd, T.fsd(f.fsd).status) : '<div class="small muted">Sem liquidação</div>'}</div></div>`;
  }
  return header({ title: `${FB ? 'Booking de frete' : 'Ordem de frete'} <span class="mono">${f.id}</span>`, sub: esc(f.stops.map(s => T.loc(s.loc).city).join(' → ') + (FB ? ' · ' + f.voyage : ' · ' + T.mtr(f.mtr).desc)), actions, tabs, tab,
    attrsList: [['Peso', kg(f.kg), 'big'], ['Distância', nf(f.km) + ' km', 'big'], ['Custo', f.charges ? money(f.charges.total) : '—', 'big'], ['Ciclo de vida', st(f.life)], ['Subcontratação', st(f.sub.status)], ['Execução', st(f.exec)], ['Liquidação', st(f.inv)], ...(f.fixed ? [['Plano', st('Fixado')]] : [])] }) + body;
}

function subView(f) {
  const tn = f.sub.tender;
  const cands = f.cat === 'FO' && f.stops.length ? T.carrierCandidates(f.id) : [];
  const rfqs = S.rfq.filter(r => r.fo === f.id);
  return `<div class="grid2"><div class="sec"><h3>Status de subcontratação</h3>${kvs([['Status', st(f.sub.status)], ['Transportadora', f.carrier ? esc(T.bpName(f.carrier)) : '—'], ['Estratégia de seleção', S.md.settings.carrierSel.strategy === 'COST' ? 'Custo total (acordos de frete)' : 'Prioridade da rota'], ['Perfil de tendering', S.md.settings.tendering.id]])}
    <div class="toolbar" style="margin-top:12px">${f.cat === 'FO' ? btn('Seleção de transportadora', 'csRun', { id: f.id }, 'pri') + btn('Iniciar tendering', 'tdStart', { id: f.id }) + btn('Enviar à transportadora', 'foSend', { id: f.id }) : btn('Solicitar booking', 'fbReq', { id: f.id }, 'pri')}${btn('Abrir portal da transportadora', 'go', { app: 'portal' })}</div></div>
    ${f.cat === 'FO' ? `<div class="sec"><h3>Ranking de transportadoras <span class="muted small">rotas de transporte + acordos de frete (cap. 6.5)</span></h3>${table([{ l: 'Rank', k: 'rank' }, { l: 'Transportadora', f: r => esc(r.bp + ' ' + T.bpName(r.bp)) }, { l: 'Rota', k: 'lane' }, { l: 'Prioridade', num: 1, k: 'prio' }, { l: 'Custo (acordo)', num: 1, f: r => r.cost != null ? money(r.cost) : 'sem acordo' }, { l: 'Custo interno da rota', num: 1, f: r => money(r.laneCost) }, { l: '', f: r => `<button class="btn ghost" data-a="csPick" data-id="${f.id}" data-bp="${r.bp}">Atribuir</button>` }], cands, { empty: 'Nenhuma rota de transporte cobre este trajeto.' })}</div>` : ''}</div>
    ${tn ? `<div class="sec"><h3>Tendering <span>${st(tn.status)}</span></h3>${kvs([['Estimativa de custo', money(tn.est)], ['Preço-limite', money(tn.priceLimit)], ['Iniciado em', dt(tn.startedAt)], ['Vencedor', tn.award ? esc(T.bpName(tn.award.carrier)) + ' · ' + money(tn.award.price) : '—']])}
      <h4>Plano de tendering</h4>${table([{ l: 'Etapa', k: 'no' }, { l: 'Tipo', f: r => r.type === 'P2P' ? 'Ponto a ponto' : 'Broadcast' }, { l: 'Transportadoras', f: r => esc(r.carriers.map(T.bpName).join(', ')) }, { l: 'Prazo', f: r => r.hours + ' h' }, { l: 'Status', f: r => st(r.status) }], tn.steps)}
      <h4>RFQs de frete e cotações</h4>${table([{ l: 'RFQ', f: r => `<span class="mono">${r.id}</span>` }, { l: 'Etapa', k: 'step' }, { l: 'Transportadora', f: r => esc(T.bpName(r.carrier)) }, { l: 'Prazo', f: r => dt(r.dueAt) }, { l: 'Preço cotado', num: 1, f: r => r.price != null ? money(r.price) : '—' }, { l: 'Motivo', f: r => esc(r.reason || '') }, { l: 'Status', f: r => st(r.status) }], rfqs)}
      <div class="toolbar" style="margin-top:12px">${btn('Simular respostas das transportadoras', 'tdSim', { id: f.id }, '', tn.status !== 'Em andamento')}${btn('Avaliar cotações', 'tdEval', { id: f.id }, 'pri', tn.status !== 'Em andamento')}${btn('Avançar relógio 4 h', 'clock', { h: 4 })}</div>
      <p class="small muted">No sistema real, o relatório /SCMTMS/TEND_CONT_PROCESS avalia as cotações em background. Aqui, “Avaliar cotações” executa a mesma lógica: ponto a ponto premia a cotação aceita dentro do preço-limite; broadcast premia o menor preço válido; sem resposta, passa à próxima etapa.</p></div>` : ''}`;
}

function execView(f) {
  const ev = T.expectedEvents(f); const next = ev.find(e => !e.done);
  const evRows = ev.map(e => ({ ...e }));
  return `<div class="sec"><h3>Eventos esperados e reportados <span class="muted small">Event handler · cap. 7.2</span></h3>
    <div class="toolbar" style="margin-bottom:10px">${btn('Verificar prontidão', 'foReady', { id: f.id })}${btn('Simular rastreamento', 'foTrack', { id: f.id }, 'pri', f.exec === 'Executado')}${btn('Reportar atraso', 'foDelay', { id: f.id }, '', f.exec === 'Executado')}${btn('Reportar discrepância', 'foDisc', { id: f.id })}</div>
    ${table([{ l: '#', f: r => r.idx + 1 }, { l: 'Evento', f: r => esc(T.EVENTS[r.code]) }, { l: 'Local', f: r => esc(T.locName(f.stops[r.stop].loc)) }, { l: 'Planejado', f: r => dt(r.plan) }, { l: 'Previsto (ETA)', f: r => r.done ? '—' : dt(r.eta) }, { l: 'Reportado', f: r => r.done ? dt(r.done.at) : '—' }, { l: 'Desvio', num: 1, f: r => r.done ? `<span style="color:${r.done.delayMin > 30 ? 'var(--neg)' : 'var(--pos)'}">${r.done.delayMin > 0 ? '+' : ''}${r.done.delayMin} min</span>` : '' }, { l: '', f: r => r.done ? st('Reportado') : (next && r.idx === next.idx ? `<span style="display:flex;gap:6px;align-items:center"><input type="datetime-local" class="inp" style="width:190px" id="evat_${r.idx}" value="${T.maxIso(S.clock, f.events.length ? f.events[f.events.length - 1].at : S.clock)}"><button class="btn pri" data-a="evReport" data-id="${f.id}" data-idx="${r.idx}">Reportar</button></span>` : st('Esperado')) }], evRows)}
    ${f.delays && f.delays.length ? `<h4>Atrasos reportados</h4>${table([{ l: 'Em', f: r => dt(r.at) }, { l: 'Minutos', num: 1, k: 'minutes' }, { l: 'Motivo', k: 'reason' }], f.delays)}` : ''}
    <h4>Status de manuseio por item</h4>${table([{ l: 'UF', f: r => L(r.fu.id) }, { l: 'Etapa', f: r => r.st.n }, { l: 'Status de manuseio', f: r => st(r.st.handling) }, { l: 'Execução da etapa', f: r => st(r.st.exec) }, { l: 'Execução da UF', f: r => st(r.fu.exec) }], f.stages.map(T.stageOf).filter(Boolean))}</div>`;
}

/* ---------------- Gestão de capacidade ---------------- */

/* ---------------- Monitor de eventos ---------------- */
function vEM() {
  const docs = S.fo.filter(f => f.life !== 'Cancelado' && f.stages.length && f.exec !== 'Não iniciado' || (f.stages.length && ['Confirmado', 'Transportadora aceitou'].includes(f.sub.status) && f.exec === 'Não iniciado'));
  const row = f => { const ev = T.expectedEvents(f); const next = ev.find(e => !e.done); const last = f.events[f.events.length - 1]; const late = (last && last.delayMin > 30) || (next && next.eta < S.clock); return { f, next, last, late, done: ev.filter(e => e.done).length, total: ev.length }; };
  const rows = docs.map(row);
  return header({ title: 'Monitor de eventos', sub: 'Visibilidade de execução: eventos esperados × reportados (SAP Event Management, cap. 7.2)' }) +
    `<div class="kpis">${[['Em execução', rows.filter(r => r.f.exec === 'Em execução').length], ['Prontos p/ execução', rows.filter(r => r.f.exec === 'Pronto p/ execução').length], ['Com atraso', rows.filter(r => r.late && r.f.exec !== 'Executado').length], ['Executados', rows.filter(r => r.f.exec === 'Executado').length]].map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('')}</div>
    <div class="sec"><h3>Event handlers</h3>${table([{ l: 'Documento', f: r => L(r.f.id) }, { l: 'Transportadora', f: r => esc(r.f.carrier ? T.bpName(r.f.carrier) : 'Frota própria') }, { l: 'Rota', f: r => esc(r.f.stops.map(s => T.loc(s.loc).city).join(' → ')) }, { l: 'Progresso', f: r => capBar(r.done, r.total) }, { l: 'Último evento', f: r => r.last ? esc(T.EVENTS[r.last.code]) + ' · ' + dt(r.last.at) : '—' }, { l: 'Próximo esperado', f: r => r.next ? esc(T.EVENTS[r.next.code]) + ' · ' + dt(r.next.eta) : '—' }, { l: 'Situação', f: r => r.f.exec === 'Executado' ? st('Executado') : r.late ? st('Atrasado') : st('No prazo') }, { l: '', f: r => r.f.exec !== 'Executado' ? `<button class="btn" data-a="foTrack" data-id="${r.f.id}">Simular rastreamento</button>` : '' }], rows, { empty: 'Nenhum documento confirmado ou em execução.' })}</div>`;
}

function mdForm(app, rec) {

    return '';

function readMD(app, rec) {
  const M = MD[app]; const out = rec ? { ...rec } : {}; const errs = [];
  M.fields.forEach(f => {
    const id = 'md_' + f.k;
    if (f.t === 'text' || f.t === 'sel') { const v = val(id); if (!(rec && f.k === M.key)) out[f.k] = v.trim ? v.trim() : v; }
    if (f.t === 'num') out[f.k] = val(id) === '' ? null : +val(id);
    if (f.t === 'chk') out[f.k] = document.getElementById(id).checked;
    if (f.t === 'multi') out[f.k] = [...document.querySelectorAll(`[data-multi="${id}"]:checked`)].map(e => e.value);
    if (f.t === 'carriers') { const n = +val('md_c_n'); const cs = []; for (let i = 0; i < n; i++) { const bp = val('md_c_bp_' + i); if (bp) cs.push({ bp, prio: +val('md_c_pr_' + i) || i + 1, costKm: val('md_c_ck_' + i) ? +val('md_c_ck_' + i) : undefined }); } out.carriers = cs; }
    if (f.req && (out[f.k] === '' || out[f.k] == null)) errs.push(f.l);
  });
  if (app === 'prod') { out.dg = out.dg_un ? { un: out.dg_un, cls: out.dg_cls || '9', pg: 'II', name: out.desc } : null; delete out.dg_un; delete out.dg_cls; }
  if (app === 'bp') { out.roles = out.roles || []; }
  return { out, errs };
}

/* ---------------- Análises ---------------- */
function vAnalytics() {
  const fos = S.fo.filter(f => f.life !== 'Cancelado' && f.stages.length);
  const cost = fos.reduce((a, f) => a + (f.charges ? f.charges.total : 0), 0);
  const rev = S.fwo.reduce((a, f) => a + (f.charges ? f.charges.total : 0), 0);
  const arr = S.fo.flatMap(f => f.events.filter(e => e.code === 'ARRIV' || e.code === 'POD'));
  const ontime = arr.length ? arr.filter(e => e.delayMin <= 30).length / arr.length * 100 : null;
  const roadFos = fos.filter(f => f.cat === 'FO');
  const util = roadFos.length ? roadFos.reduce((a, f) => a + f.kg / T.mtr(f.mtr).capKg, 0) / roadFos.length * 100 : 0;
  const byCarrier = {}; fos.forEach(f => { if (f.carrier && f.charges) byCarrier[f.carrier] = (byCarrier[f.carrier] || 0) + f.charges.total; });
  const cr = Object.entries(byCarrier).sort((a, b) => b[1] - a[1]); const maxC = Math.max(1, ...cr.map(x => x[1]));
  const byCust = {}; S.fwo.forEach(f => { const p = T.profitability(f); const k = f.orderingParty; byCust[k] = byCust[k] || { rev: 0, cost: 0 }; byCust[k].rev += p.revenue; byCust[k].cost += p.cost; });
  const cu = Object.entries(byCust).filter(([, v]) => v.rev || v.cost); const maxR = Math.max(1, ...cu.map(([, v]) => Math.max(v.rev, v.cost)));
  const pl = ['UFs não criadas', 'Não planejado', 'Parcialmente planejado', 'Planejado'].map(s => [s, S.fwo.filter(f => T.reqPlanStatus(f) === s).length]);
  const maxP = Math.max(1, ...pl.map(x => x[1]));
  return header({ title: 'Visão geral de transporte', sub: 'Análises embarcadas · cap. 12.1' }) +
    `<div class="kpis">${[['Ordens de expedição', S.fwo.length], ['Unidades de frete', S.fu.length], ['Ordens/bookings ativos', fos.length], ['Receita (OE)', money(rev)], ['Custo de frete (OF/BF)', money(cost)], ['Margem bruta', money(rev - cost)], ['Pontualidade', ontime == null ? '—' : nf(ontime) + '%'], ['Ocupação média rodoviária', nf(util) + '%']].map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('')}</div>
    <div class="grid2"><div class="sec"><h3>Custo de frete por transportadora</h3>${cr.length ? `<div class="hbar">${cr.map(([k, v]) => `<span>${esc(T.bpName(k))}</span><div class="b" style="width:${v / maxC * 100}%"></div><span class="num">${money(v)}</span>`).join('')}</div>` : '<div class="empty">Sem encargos calculados.</div>'}</div>
    <div class="sec"><h3>Ordens de expedição por status de planejamento</h3><div class="hbar">${pl.map(([k, v]) => `<span>${esc(k)}</span><div class="b" style="width:${v / maxP * 100}%"></div><span class="num">${v}</span>`).join('')}</div></div>
    <div class="sec"><h3>Receita × custo por cliente <span class="legend"><span><i></i>Receita</span><span><i style="background:var(--pos)"></i>Custo</span></span></h3>${cu.length ? `<div class="hbar">${cu.map(([k, v]) => `<span>${esc(T.bpName(k))}</span><div><div class="b" style="width:${v.rev / maxR * 100}%;margin-bottom:3px"></div><div class="b alt" style="width:${v.cost / maxR * 100}%"></div></div><span class="num small">${money(v.rev - v.cost)}<br><span class="muted">margem</span></span>`).join('')}</div>` : '<div class="empty">Sem dados.</div>'}</div>
    <div class="sec"><h3>Documentos de liquidação</h3>${table([{ l: 'Documento', f: r => L(r.id) }, { l: 'Tipo', f: r => r.fo ? 'DLF (compra)' : 'DLE (venda)' }, { l: 'Valor', num: 1, f: r => money(r.amount) }, { l: 'Status', f: r => st(r.status) }], [...S.fsd, ...S.fwsd])}</div></div>`;
}

  incAdd: () => act(() => { const a = val('inc_a'), b = val('inc_b'); if (a === b) return T.err('Escolha características diferentes.'); S.md.settings.incompat.push({ a, b, desc: a.replace(':', ' ') + ' x ' + b.replace(':', ' ') }); T.ok('Incompatibilidade adicionada.'); }),

  /* sistema */
  exportJ: () => { const j = JSON.stringify(S); dialog('Exportar estado', `<p class="muted small">Copie e guarde este JSON. Para restaurar, use “Importar estado”.</p><textarea id="dl_json" class="inp" style="height:260px;width:100%;font-family:var(--f-mono);font-size:11px" readonly>${esc(j)}</textarea>`, [{ l: 'Copiar', cls: 'pri', fn: () => { const t = document.getElementById('dl_json'); (navigator.clipboard ? navigator.clipboard.writeText(j) : Promise.reject()).then(() => toast('JSON copiado.')).catch(() => { t.focus(); t.select(); toast('Selecionado: use Ctrl+C.'); }); } }], true); },
  importJ: () => dialog('Importar estado', '<textarea id="dl_json" class="inp" style="height:260px;width:100%;font-family:var(--f-mono);font-size:11px" placeholder="Cole aqui o JSON exportado"></textarea>', [{ l: 'Importar', cls: 'pri', fn: () => { try { const x = JSON.parse(val('dl_json')); if (x.v !== 3 || !x.md) throw new Error('formato'); S = x; U.dlg = null; U.app = 'home'; U.id = null; act(() => T.ok('Estado importado.')); } catch (e) { toast('JSON inválido para este simulador.', 'E'); } } }], true),
  resetAsk: d => dialog('Reinicializar sistema', `<p>${d.demo === '1' ? 'Restaurar o cenário de demonstração' : 'Começar apenas com dados mestres'}? Todos os documentos atuais serão apagados.</p>`, [{ l: 'Reinicializar', cls: 'neg', fn: () => { newState(d.demo === '1'); U.dlg = null; U.lastMsgs = []; U.ck = { sel: new Set(), doc: null, res: null, mode: 'RD', zone: '', showPlanned: false }; U.stack = []; save(); go('home', null, null, false); toast('Sistema reinicializado.'); } }]),
  exToggle: d => { const e = EXERCISES.find(x => x.id === d.id); const cur = U.exOpen[d.id] ?? (!exDone(e) && EXERCISES.findIndex(x => !exDone(x)) === EXERCISES.indexOf(e)); U.exOpen[d.id] = !cur; render(); },
  exGo: d => { const e = EXERCISES.find(x => x.id === d.id); go(e.app, e.appId || null, e.appTab || null); }
};
function ckPreselect(fuIds) {
  const C0 = U.ck; C0.sel = new Set(); let mode = null;
  fuIds.forEach(id => { const u = T.fu(id); const st = u && u.stages.find(s => !s.fo); if (st) { mode = mode || st.mode; if (st.mode === mode) C0.sel.add(u.id + '#' + st.n); } });
  C0.mode = mode || 'RD'; C0.zone = ''; C0.doc = null; go('cockpit');
}
function tpDialog(fuId, n) {
  OUT.length = 0; const ps = T.proposals(fuId, n); const errs = [...OUT];
  if (!ps.length) { U.lastMsgs = errs.length ? errs : [{ type: 'W', text: 'Nenhuma proposta encontrada (verifique rotas de transporte, bookings e capacidade).' }]; render(); toast(U.lastMsgs[0].text, 'W'); return; }
  U.tpList = ps;
  dialog('Proposta de transporte · UF ' + fuId, `<p class="muted small">Alternativas calculadas com as rotas de transporte e os acordos de frete (rodoviário) ou com os bookings disponíveis (marítimo/aéreo). Cap. 5.7.9.</p>` +
    table([{ l: 'Alternativa', f: r => esc(r.label) }, { l: 'Distância', num: 1, f: r => nf(r.km) + ' km' }, { l: 'Chegada', f: r => dt(r.arr) }, { l: 'Atraso', num: 1, f: r => r.lateH ? nf(r.lateH, 1) + ' h' : '—' }, { l: 'Custo', num: 1, f: r => r.cost != null ? money(r.cost) : (r.booking ? (r.cutoffOk ? 'cut-off ok' : '<span style="color:var(--neg)">após cut-off</span>') : '—') }, { l: '', f: r => `<button class="btn pri" data-a="tpPick" data-i="${ps.indexOf(r)}">Selecionar</button>` }], ps), [], true);
}
A.tpPick = d => { const p = U.tpList[+d.i]; U.dlg = null; const r = act(() => T.acceptProposal(p)); if (r && r.id) go('fo', r.id); };
function optDialog() {
  OUT.length = 0; const r = T.optimize([...U.ck.sel]);
  if (!r.tours.length && !r.unplanned.length) return act(() => T.info('Nenhuma etapa rodoviária aberta para otimizar.'));
  U.optRes = r;
  dialog('Resultado do otimizador VSR', `<div class="kpis">${[['Tours', r.kpi.tours], ['Distância', nf(r.kpi.km) + ' km'], ['Custo de planejamento', money(r.kpi.cost)], ['Atraso total', nf(r.kpi.late, 1) + ' h'], ['Não planejadas', r.kpi.unplanned]].map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('')}</div>
    <h4>Tours propostos</h4>${table([{ l: '#', f: x => r.tours.indexOf(x) + 1 }, { l: 'Veículo', f: x => esc(x.mtr + ' · ' + x.resource) }, { l: 'Rota', f: x => esc(x.stops.map(s => T.loc(s).city).join(' → ')) }, { l: 'UFs', f: x => x.keys.map(k => k.split('#')[0]).join(', ') }, { l: 'km', num: 1, f: x => nf(x.km) }, { l: 'Custo', num: 1, f: x => money(x.cost) }, { l: 'Atraso', num: 1, f: x => x.lateH ? nf(x.lateH, 1) + ' h' : '—' }], r.tours)}
    ${r.unplanned.length ? `<h4>Etapas não planejadas</h4>${table([{ l: 'Etapa', f: x => esc(x.key) }, { l: 'Motivo', f: x => esc(x.reason) }], r.unplanned)}` : ''}
    <h4>Ferramenta de explicação (cap. 5.8.6)</h4><ol class="small muted" style="padding-left:18px">${r.log.map(l => `<li>${esc(l)}</li>`).join('')}</ol>`, [{ l: 'Aceitar plano', cls: 'pri', fn: () => { U.dlg = null; U.ck.sel.clear(); act(() => T.acceptPlan(U.optRes)); } }], true);
}
function mdEdit(app, id) {
  const M = MD[app]; const rec = id ? S.md[M.coll].find(x => x[M.key] === id) : null;
  dialog((rec ? 'Editar ' : 'Criar ') + M.one, mdForm(app, rec), [{ l: 'Gravar', cls: 'pri', fn: () => {
    const { out, errs } = readMD(app, rec);
    if (errs.length) return toast('Preencha: ' + errs.join(', '), 'E');
    if (!rec && S.md[M.coll].some(x => x[M.key] === out[M.key])) return toast('Já existe um registro com esse ID.', 'E');
    U.dlg = null;
    act(() => { if (rec) Object.assign(rec, out); else S.md[M.coll].push(out); T.ok(`${M.title}: ${out[M.key]} ${rec ? 'alterado' : 'criado'}.`); });
  } }], true);
}

/* ---------------- listeners ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (U.menu && !e.target.closest('.menu')) { U.menu = null; if (!el) { render(); return; } }
  if (U.pop && !e.target.closest('.pop') && !(el && el.dataset.a === 'pop')) { U.pop = false; if (!el) { render(); return; } }
  if (!el) return;
  if (el.tagName === 'TR' && e.target.closest('input,button,select,a,.lnk')) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('change', e => {
  const el = e.target; const c = el.dataset && el.dataset.c; if (!c) return;
  if (c === 'filter') { U.f[U.app] = U.f[U.app] || {}; U.f[U.app][el.dataset.k] = el.value; render(); }
  if (c === 'rf') {
    const F = U.form; const k = el.id.replace('rf_', ''); readReqForm();
    if (k === 'consignee') { const b = T.bp(el.value); if (b && b.loc) F.dst = b.loc; }
    if (k === 'orderingParty') { const b = T.bp(el.value); if (b && b.loc) F.src = b.loc; }
    if (k === 'mode') F.movement = 'DD';
    render();
  }
  if (c === 'ck') { const C0 = U.ck; if (el.id === 'ck_mode') { C0.mode = el.value; C0.sel.clear(); C0.doc = null; } if (el.id === 'ck_zone') C0.zone = el.value; if (el.id === 'ck_planned') C0.showPlanned = el.value === '1'; render(); }
  if (c === 'portal') { U.portalCarrier = el.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (U.dlg) closeDlg(); else if (U.menu || U.pop) { U.menu = null; U.pop = false; render(); } }
  if (e.key === 'Enter' && e.target.id === 'gsearch') {
    const q = e.target.value.trim(); if (!q) return;
    if (/^\d{8,10}$/.test(q)) { const a = docApp(q); const exists = a && ({ fwo: T.fwo, fwq: T.fwq, otr: T.otr, fu: T.fu, fo: T.fo, fsd: T.fsd, fwsd: T.fwsd, rfq: T.rfq }[a])(q); if (exists) return openDoc(q); return toast('Documento ' + q + ' não encontrado.', 'E'); }
    const hit = Object.entries(APPS).find(([k, v]) => (v[0] + ' ' + v[1]).toLowerCase().includes(q.toLowerCase())); if (hit) go(hit[0]); else toast('Nada encontrado para “' + q + '”.', 'W');
  }
});

/* ---------------- inicialização ---------------- */
(function init() {
  try { const t = localStorage.getItem('sap-tm-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { }
  const had = load();
  if (!had) save();
  render();
  setTimeout(connectDB, 50);
})();

</script>
